name: 💡 Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Heads-up on scope: this is the **free, alert-only** detector. Dashboards,
        billing, and protected-member ban-capping live in the hosted paid tier and
        won't be added here — but detection accuracy, deploy ergonomics, and docs
        are all fair game.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that's hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
